name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '44 21 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:v2
          coverage: xdebug
          
      - name: Install phar-composer
        run: |
            curl -JOL https://clue.engineering/phar-composer-latest.phar
            chmod 755 phar-composer-latest.phar
            sudo mv phar-composer.phar /usr/local/bin/phar-composer
            phar-composer --version
          
      - name: Install phpacker
        run: |
            composer global require phpacker/phpacker
            export PATH=~/.config/.composer/vendor/bin:$PATH
            phpacker --version